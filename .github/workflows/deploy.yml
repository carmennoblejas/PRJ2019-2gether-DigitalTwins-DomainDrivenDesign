name: CD - Build and Push Docker Images

on:
  workflow_run:
    workflows: [".NET"]
    types:
      - completed
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code from successful CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          DATE_TAG=$(date +'%Y%m%d-%H%M%S')
          echo "tag=${DATE_TAG}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push API Flask
        uses: docker/build-push-action@v5
        with:
          context: "./ChildHDT.API/PWA FLASK"
          file: "./ChildHDT.API/PWA FLASK/Dockerfile"
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-flask:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-flask:${{ steps.tag.outputs.tag }}

      - name: Build and push ChildHDT API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ChildHDT.API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/childhdt:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/childhdt:${{ steps.tag.outputs.tag }}

      - name: Summary
        run: |
          echo "### Docker images pushed successfully! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/api-flask:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/childhdt:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY